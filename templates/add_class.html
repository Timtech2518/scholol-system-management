<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Class - St. Gabriel Secondary School</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fc;
            color: #1e293b;
        }

        .header {
            background: #0d47a1;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            font-size: 13px;
            margin-top: 5px;
            opacity: 0.9;
        }

        .back-btn {
            text-decoration: none;
            background: white;
            color: #0d47a1;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #0d47a1;
            margin-bottom: 8px;
        }

        .card .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0d47a1;
            box-shadow: 0 0 0 2px rgba(13, 71, 161, 0.1);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        .save-btn {
            border: none;
            background: #0d47a1;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .save-btn:hover {
            background: #083b87;
        }

        .cancel-btn {
            text-decoration: none;
            background: #e2e8f0;
            color: #334155;
            padding: 13px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        .required {
            color: red;
        }

        @media (max-width: 700px) {

            .header {
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .buttons {
                flex-direction: column;
            }

            .save-btn,
            .cancel-btn {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <div>
            <h1>St. Gabriel Secondary School</h1>
            <p>Class Management → Add New Class</p>
        </div>

        <a href="{{ url_for('classes') }}" class="back-btn">
            ← Back to Classes
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h2>Add New Class</h2>

            <p class="subtitle">
                Create a new class and assign a class teacher.
            </p>


            <form method="POST">

                <div class="form-grid">

                    <!-- CLASS NAME -->
                    <div class="form-group">

                        <label>
                            Class Name <span class="required">*</span>
                        </label>

                        <select name="class_name" required>

                            <option value="">
                                Select Class
                            </option>

                            <option value="JSS1">
                                JSS1
                            </option>

                            <option value="JSS2">
                                JSS2
                            </option>

                            <option value="JSS3">
                                JSS3
                            </option>

                            <option value="SS1">
                                SS1
                            </option>

                            <option value="SS2">
                                SS2
                            </option>

                            <option value="SS3">
                                SS3
                            </option>

                        </select>

                    </div>


                    <!-- CLASS LEVEL -->
                    <div class="form-group">

                        <label>
                            Class Level <span class="required">*</span>
                        </label>

                        <select name="class_level" id="class_level" required>

                            <option value="">
                                Select Level
                            </option>

                            <option value="Junior Secondary">
                                Junior Secondary
                            </option>

                            <option value="Senior Secondary">
                                Senior Secondary
                            </option>

                        </select>

                    </div>


                    <!-- CLASS TEACHER -->
                    <div class="form-group full">

                        <label>
                            Class Teacher
                        </label>

                        <select name="class_teacher">

                            <option value="">
                                Select Class Teacher
                            </option>

                            {% for teacher in teachers %}

                                <option value="{{ teacher.full_name }}">
                                    {{ teacher.full_name }}
                                </option>

                            {% endfor %}

                        </select>

                        <div class="hint">
                            Only active teachers are shown.
                        </div>

                    </div>


                    <!-- DESCRIPTION -->
                    <div class="form-group full">

                        <label>
                            Description
                        </label>

                        <textarea
                            name="description"
                            placeholder="Enter a short description for this class (optional)..."
                        ></textarea>

                    </div>


                    <!-- STATUS -->
                    <div class="form-group">

                        <label>
                            Status <span class="required">*</span>
                        </label>

                        <select name="status" required>

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <!-- BUTTONS -->
                <div class="buttons">

                    <button type="submit" class="save-btn">
                        + Add Class
                    </button>

                    <a
                        href="{{ url_for('classes') }}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
