<title>Add New Teacher | St. Gabriel School</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f4f7fb;
        color: #1f2937;
    }

    .header {
        background: #0b3d91;
        color: white;
        padding: 22px 30px;
    }

    .header h1 {
        font-size: 25px;
        margin-bottom: 5px;
    }

    .header p {
        opacity: 0.9;
        font-size: 14px;
    }

    .container {
        max-width: 950px;
        margin: 35px auto;
        padding: 0 20px;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 30px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .section-title {
        font-size: 18px;
        font-weight: bold;
        color: #0b3d91;
        margin-bottom: 22px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e5e7eb;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full {
        grid-column: span 2;
    }

    label {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #374151;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background: white;
        transition: 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #0b3d91;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    }

    textarea {
        resize: vertical;
        min-height: 100px;
    }

    .required {
        color: #dc3545;
    }

    .auto-id {
        background: #f1f5f9;
        color: #64748b;
        cursor: not-allowed;
        font-weight: bold;
    }

    .id-note {
        font-size: 12px;
        color: #6b7280;
        margin-top: 6px;
    }

    .buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        gap: 15px;
    }

    .btn {
        text-decoration: none;
        border: none;
        padding: 13px 22px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-back {
        background: #e9ecef;
        color: #374151;
    }

    .btn-back:hover {
        background: #dfe3e7;
    }

    .btn-save {
        background: #0b3d91;
        color: white;
    }

    .btn-save:hover {
        background: #092f70;
    }

    @media (max-width: 700px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: span 1;
        }

        .card {
            padding: 20px;
        }

        .buttons {
            flex-direction: column;
        }

        .btn {
            width: 100%;
            text-align: center;
        }
    }

</style>
```

</head>

<body>

```
<!-- HEADER -->

<div class="header">

    <h1>Teacher Management</h1>

    <p>Add a new teacher to St. Gabriel Secondary School</p>

</div>


<!-- CONTENT -->

<div class="container">

    <div class="card">

        <div class="section-title">
            Add New Teacher
        </div>


        <form method="POST">

            <div class="form-grid">


                <!-- TEACHER ID -->

                <div class="form-group">

                    <label>
                        Teacher ID
                    </label>

                    <input
                        type="text"
                        value="Auto-generated"
                        class="auto-id"
                        disabled
                    >

                    <span class="id-note">
                        Teacher ID will be generated automatically.
                    </span>

                </div>


                <!-- FULL NAME -->

                <div class="form-group">

                    <label>
                        Full Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        placeholder="Enter teacher's full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="teacher@example.com"
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="e.g. 08012345678"
                    >

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label>Gender</label>

                    <select name="gender">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label>Subject</label>

                    <input
                        type="text"
                        name="subject"
                        placeholder="e.g. Mathematics"
                    >

                </div>


                <!-- CLASS -->

                <div class="form-group">

                    <label>Class</label>

                    <select name="class_name">

                        <option value="">
                            Select Class
                        </option>

                        <option value="JSS1">JSS1</option>
                        <option value="JSS2">JSS2</option>
                        <option value="JSS3">JSS3</option>

                        <option value="SS1">SS1</option>
                        <option value="SS2">SS2</option>
                        <option value="SS3">SS3</option>

                    </select>

                </div>


                <!-- QUALIFICATION -->

                <div class="form-group">

                    <label>Qualification</label>

                    <select name="qualification">

                        <option value="">
                            Select Qualification
                        </option>

                        <option value="NCE">
                            NCE
                        </option>

                        <option value="OND">
                            OND
                        </option>

                        <option value="HND">
                            HND
                        </option>

                        <option value="B.Sc">
                            B.Sc
                        </option>

                        <option value="B.Ed">
                            B.Ed
                        </option>

                        <option value="M.Sc">
                            M.Sc
                        </option>

                        <option value="M.Ed">
                            M.Ed
                        </option>

                        <option value="Ph.D">
                            Ph.D
                        </option>

                    </select>

                </div>


                <!-- ADDRESS -->

                <div class="form-group full">

                    <label>Address</label>

                    <textarea
                        name="address"
                        placeholder="Enter teacher's residential address"
                    ></textarea>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="{{ url_for('teachers') }}"
                    class="btn btn-back"
                >
                    ← Back to Teachers
                </a>


                <button
                    type="submit"
                    class="btn btn-save"
                >
                    Save Teacher
                </button>

            </div>

        </form>

    </div>

</div>
```

</body>
</html>
